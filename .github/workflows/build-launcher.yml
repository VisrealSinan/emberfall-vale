name: Build Windows launcher

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: emberfall-vale-windows
          path: launcher/dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Emberfall Vale ${{ github.ref_name }}
          files: launcher/dist/*.exe
          body: |
            **EmberfallVale-Setup** installs the game with a desktop shortcut.
            **EmberfallVale-Portable** runs without installing.

            Windows may show "Windows protected your PC" because the app isn't code-signed. Click **More info**, then **Run anyway**.
