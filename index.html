<title>Emberfall Vale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-screen cel-shaded world; WoW-style HUD (unit frames top-left, minimap top-right,
   action bar + XP bar bottom-centre, micro menu bottom-right); floating windows for character,
   bags, talents, quests, spellbook, map, vendor and NPC dialogue. One deliberate night-blue look. */
:root{
  --ink:#0e1122; --panel:rgba(15,19,38,.9); --panel2:rgba(26,32,58,.95); --line:rgba(255,226,160,.26); --line2:rgba(255,226,160,.5);
  --gold:#ffd479; --accent:#7fd8ff; --hp:#ff5a6a; --hp2:#c8344f; --stam:#8fe37a; --xp:#b48cff; --text:#f4f1ff; --muted:#a9b0cf;
  --q0:#9d9d9d; --q1:#ffffff; --q2:#3dff3a; --q3:#4aa8ff; --q4:#c27bff; --q5:#ff9b2e;
  --display:'Cinzel',Georgia,'Times New Roman',serif;
  --body:'M PLUS Rounded 1c','Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px;-webkit-user-select:none;user-select:none}
button{font-family:var(--body);color:inherit}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.lab{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:800}
.q0{color:var(--q0)}.q1{color:var(--q1)}.q2{color:var(--q2)}.q3{color:var(--q3)}.q4{color:var(--q4)}.q5{color:var(--q5)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{position:absolute}
.frame{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px 7px 7px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#pframe{top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));width:min(270px,58vw)}
.portrait{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;color:#fff;border:2px solid var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.5);text-shadow:0 1px 2px #000}
.fbody{flex:1;min-width:0;display:grid;gap:3px}
.fname{display:flex;justify-content:space-between;gap:6px;font-weight:800;font-size:13px;white-space:nowrap}
.fname span:first-child{overflow:hidden;text-overflow:ellipsis}
.flvl{color:var(--gold);font-variant-numeric:tabular-nums}
.bar{position:relative;height:12px;background:rgba(255,255,255,.09);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:6px;transition:width .15s linear}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;font-weight:800;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.bar.hp i{background:linear-gradient(90deg,var(--hp2),var(--hp))}
.bar.st{height:5px}.bar.st i{background:var(--stam)}
#buffs{top:calc(72px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;gap:4px;flex-wrap:wrap;max-width:260px}
.buff{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;font-size:10px;font-weight:800;position:relative;text-shadow:0 1px 2px #000;background:var(--panel)}
.buff b{position:absolute;bottom:-1px;right:2px;font-size:9px}
#tframe{top:calc(10px + env(safe-area-inset-top,0px));left:calc(290px + env(safe-area-inset-left,0px));width:240px}
#tframe .portrait{width:38px;height:38px;font-size:15px;border-color:var(--hp)}
#tframe.elite .portrait{border-color:var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.5),0 0 10px var(--gold)}
.etag{font-size:9px;font-weight:800;color:var(--ink);background:var(--gold);border-radius:4px;padding:0 4px;margin-left:4px}
#tracker{top:calc(118px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));width:min(260px,50vw);display:grid;gap:8px}
.trk{background:linear-gradient(90deg,rgba(15,19,38,.78),rgba(15,19,38,0));padding:4px 8px;border-left:2px solid var(--gold);border-radius:2px}
.trk b{display:block;font-size:13px;color:var(--gold)}
.trk div{font-size:12px;color:var(--text);line-height:1.35}
.trk div.ok{color:var(--q2)}
#mm{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:grid;gap:5px;justify-items:center}
#zoneName{font-family:var(--display);font-weight:800;font-size:13px;color:var(--gold);text-shadow:0 1px 3px #000;letter-spacing:.04em}
#map{width:160px;height:160px;border-radius:50%;border:2px solid var(--line2);background:#0d1a22;box-shadow:0 0 0 4px rgba(15,19,38,.75)}
#clock{font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px 9px;font-variant-numeric:tabular-nums}
#boss{top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(440px,40vw);text-align:center}
.bname{font-family:var(--display);font-weight:800;letter-spacing:.1em;color:#ffb46b;text-shadow:0 2px 6px #000;margin-bottom:3px;font-size:15px}
#boss .bar{height:14px;border:1px solid rgba(255,140,80,.6)}#boss .bar i{background:linear-gradient(90deg,#c43a1c,#ff8a4a)}
#log{top:22%;left:50%;transform:translateX(-50%);display:grid;gap:5px;justify-items:center;width:min(520px,92vw)}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 14px;font-weight:700;text-align:center;animation:tin .25s ease-out}
.toast.fade{opacity:0;transition:opacity .5s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#banner{top:34%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,54px);color:var(--gold);letter-spacing:.08em;text-shadow:0 3px 18px rgba(0,0,0,.85);opacity:0;transition:opacity .4s;white-space:nowrap}
#banner.show{opacity:1}
#zoneBanner{top:15%;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .8s}
#zoneBanner.show{opacity:1}
#zoneBanner b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,44px);color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.8),0 0 30px rgba(127,216,255,.4)}
#zoneBanner span{font-size:14px;font-weight:700;color:var(--gold);text-shadow:0 1px 4px #000}
#prompt{bottom:calc(150px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 14px;white-space:nowrap;font-weight:700}
#castbar{bottom:calc(170px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:260px;height:18px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
#castbar i{display:block;height:100%;background:linear-gradient(90deg,#d9a93a,var(--gold));width:0}
#castbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
#bottom{bottom:calc(8px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:grid;gap:6px;justify-items:center}
#abar{display:flex;gap:5px;pointer-events:auto}
.slot{position:relative;width:54px;height:54px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;overflow:hidden;touch-action:none;padding:0}
.slot .k{position:absolute;top:2px;left:5px;font-size:10px;font-weight:800;color:var(--gold);z-index:2;text-shadow:0 1px 2px #000}
.slot .ic{width:40px;height:40px;border-radius:8px}
.slot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--cd,0)*100%);background:rgba(0,0,0,.65);pointer-events:none}
.slot .cdv{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;z-index:2;text-shadow:0 1px 3px #000}
.slot.locked .ic{filter:grayscale(1) brightness(.4)}
.slot.locked .cdv{font-family:var(--body);font-size:10px;color:var(--muted)}
.slot.active{border-color:var(--q2);box-shadow:inset 0 0 0 1px var(--q2)}
.slot.oor .ic{filter:saturate(.3) brightness(.7)}
.slot .n{position:absolute;bottom:2px;right:4px;font-size:10px;font-weight:800;text-shadow:0 1px 2px #000;z-index:2}
#xpbar{position:relative;width:min(560px,92vw);height:10px;background:rgba(15,19,38,.85);border:1px solid var(--line);border-radius:6px;overflow:hidden}
#xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7a52d8,var(--xp));width:0;transition:width .2s}
#xpbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:800;text-shadow:0 1px 2px #000}
#micro{bottom:calc(10px + env(safe-area-inset-bottom,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:4px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:260px}
#micro button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:10px;font-weight:800;cursor:pointer;padding:0;position:relative}
#micro button:hover{border-color:var(--gold);color:var(--gold)}
#micro button.dot::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
#plates{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.plate{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;font-weight:800;font-size:11.5px;text-shadow:0 1px 2px #000,0 0 4px rgba(0,0,0,.8)}
.plate .pb{width:80px;height:6px;margin:2px auto 0;background:rgba(0,0,0,.6);border-radius:3px;overflow:hidden;border:1px solid rgba(0,0,0,.6)}
.plate .pb i{display:block;height:100%;background:var(--hp)}
.plate.tgt .pb{outline:1px solid #fff}
.plate.tgt{font-size:12.5px}
.plate .st{color:var(--gold)}
.plate.npc{color:#7dff7a}
.plate.npc small{display:block;font-size:10px;color:#c8f5c4}
.plate .mk{font-family:var(--display);font-size:24px;line-height:1;color:var(--gold);display:block;text-shadow:0 0 8px rgba(255,212,121,.7),0 2px 2px #000}
.plate .mk.grey{color:#9aa;text-shadow:0 2px 2px #000}
#floats{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.ft{position:absolute;font-family:var(--display);font-weight:800;font-size:18px;transform:translate(-50%,-50%);text-shadow:0 2px 3px #000,0 0 8px rgba(0,0,0,.6);animation:rise .95s ease-out forwards;white-space:nowrap}
.ft.crit{font-size:27px;color:var(--gold)}.ft.dmg{color:#fff}.ft.hurt{color:#ff6a5c}.ft.heal{color:#8fff7a}.ft.gold{color:var(--gold);font-size:14px}.ft.xpf{color:var(--xp);font-size:14px}
.ft.dot{color:#d4a8ff;font-size:14px}.ft.info{color:#e8e4ff;font-size:13px;font-family:var(--body)}.ft.pet{color:#ffcf8a;font-size:14px}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-56px}}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 120px 30px rgba(220,30,40,.7);opacity:0;transition:opacity .35s}

/* ---------- windows ---------- */
.win{position:fixed;z-index:20;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.55);display:flex;flex-direction:column;max-height:calc(100% - 24px);pointer-events:auto}
.win>header{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 16px;border-bottom:1px solid var(--line)}
.win>header h3{margin:0;font-family:var(--display);font-weight:800;font-size:16px;color:var(--gold);letter-spacing:.05em;flex:1}
.win .x{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:16px;line-height:1}
.win .x:hover{border-color:var(--hp);color:var(--hp)}
.wbody{padding:12px 14px;overflow-y:auto;min-height:0}
.btn{font-size:14px;font-weight:800;color:var(--ink);background:var(--gold);border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2)}
.btn.danger{background:#ff5a6a;color:#fff}
.btn:hover{filter:brightness(1.08)}.btn:focus-visible,.slot:focus-visible,.isl:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.sm{font-size:12px;padding:6px 10px;border-radius:8px}

#winChar{left:calc(12px + env(safe-area-inset-left,0px));top:60px;width:min(470px,calc(100vw - 24px))}
.doll{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.dcol{display:grid;gap:6px;align-content:start}
.isl{width:52px;height:52px;border-radius:10px;border:2px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);position:relative;cursor:pointer;padding:0;display:grid;place-items:center;overflow:hidden}
.isl img{width:100%;height:100%;display:block}
.isl .sl{font-size:8.5px;color:var(--muted);font-weight:700;text-align:center;line-height:1.1;padding:2px}
.isl.r0{border-color:#6a6a6a}.isl.r1{border-color:#d8d8d8}.isl.r2{border-color:var(--q2)}.isl.r3{border-color:var(--q3)}.isl.r4{border-color:var(--q4)}.isl.r5{border-color:var(--q5);box-shadow:0 0 10px rgba(255,155,46,.5)}
.isl.sel{outline:2px solid #fff}
.isl .cnt{position:absolute;bottom:1px;right:3px;font-size:10px;font-weight:800;text-shadow:0 1px 2px #000}
.dmid{position:relative;min-height:330px;border-radius:12px;background:radial-gradient(ellipse at 50% 70%,rgba(127,216,255,.18),rgba(0,0,0,.25) 70%);overflow:hidden}
#charCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
.dname{position:absolute;top:8px;left:0;right:0;text-align:center;font-weight:800;font-size:13px;text-shadow:0 1px 3px #000}
.dname small{display:block;color:var(--gold);font-size:11.5px}
.dweap{display:flex;justify-content:center;gap:8px;margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;margin-top:12px;font-size:13px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.08);padding:2px 0}
.stats b{font-variant-numeric:tabular-nums;color:var(--gold)}

#winBags{right:calc(12px + env(safe-area-inset-right,0px));bottom:110px;width:min(420px,calc(100vw - 24px))}
.bagrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.bagrid .isl{width:auto;aspect-ratio:1;height:auto}
.bagfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.goldv{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}

#winTal{left:50%;top:50%;transform:translate(-50%,-50%);width:min(780px,calc(100vw - 24px))}
.trees{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tree{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(0,0,0,.2)}
.tree h4{margin:0 0 2px;font-family:var(--display);font-size:15px;display:flex;justify-content:space-between}
.tree p{margin:0 0 8px;font-size:12px;color:var(--muted);min-height:2.6em}
.trows{display:grid;gap:8px}
.tal{display:flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px;background:rgba(255,255,255,.03);cursor:pointer;text-align:left;width:100%}
.tal .ti{width:34px;height:34px;border-radius:8px;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 2px #000}
.tal .tn{flex:1;min-width:0;font-size:12.5px;font-weight:700;line-height:1.2}
.tal .tr{font-size:11px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.tal.locked{opacity:.38;cursor:default}
.tal.max{border-color:var(--gold)}
.tal.cap .ti{box-shadow:0 0 0 2px var(--gold)}
.talfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap}

#winQuest{left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100vw - 24px));height:min(520px,calc(100% - 24px))}
.qlay{display:grid;grid-template-columns:230px 1fr;gap:12px;min-height:0;flex:1}
.qlist{overflow-y:auto;display:grid;gap:3px;align-content:start;border-right:1px solid var(--line);padding-right:8px}
.qlist h5{margin:8px 0 2px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.qli{text-align:left;background:none;border:0;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:6px}
.qli:hover,.qli.sel{background:rgba(255,212,121,.12)}
.qli .lv{font-size:11px;font-variant-numeric:tabular-nums}
.qdet{overflow-y:auto;padding-right:4px}
.qdet h4{margin:0 0 6px;font-family:var(--display);font-size:18px;color:var(--gold)}
.qdet p{margin:0 0 10px;line-height:1.55;font-size:14px;max-width:62ch}
.qobj{margin:0 0 10px;padding-left:18px;line-height:1.6}
.qobj li.ok{color:var(--q2)}
.rew{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 10px}
.rew .isl.pickable{cursor:pointer}
.rew .isl.chosen{outline:3px solid var(--gold)}

#winSpell{left:calc(12px + env(safe-area-inset-left,0px));top:60px;width:min(460px,calc(100vw - 24px))}
.spl{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.spl .ic{width:40px;height:40px;border-radius:9px;flex:none}
.spl.locked{opacity:.45}
.spl b{display:block;font-size:14px}
.spl small{color:var(--muted);font-size:12px}
.spl p{margin:2px 0 0;font-size:13px;line-height:1.4}

#winMap{left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,calc(100vw - 24px))}
#bigmap{width:100%;aspect-ratio:1;border-radius:10px;display:block;background:#0d1a22}

#winVendor{left:calc(12px + env(safe-area-inset-left,0px));top:60px;width:min(400px,calc(100vw - 24px))}
.vrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.vrow .nm{flex:1;min-width:0;font-weight:700;font-size:13px}
.vrow .pr{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}

#winNpc{left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(600px,calc(100vw - 24px));max-height:70%}
.npct{font-size:15px;line-height:1.55;margin:0 0 12px;max-width:62ch}
.opts{display:grid;gap:5px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:14px;font-weight:700}
.opt:hover{border-color:var(--gold)}
.opt .mk{font-family:var(--display);font-weight:800;font-size:18px;width:18px;text-align:center;color:var(--gold)}
.opt .mk.grey{color:#9aa}
.opt small{margin-left:auto;color:var(--muted);font-size:11px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

#winMenu{left:50%;top:50%;transform:translate(-50%,-50%);width:min(300px,calc(100vw - 24px))}
#winMenu .wbody{display:grid;gap:8px}
#winMenu .btn{width:100%}
#winSet{left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 24px))}
.field{display:grid;gap:6px;margin-bottom:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;padding:8px 10px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:9px;font-weight:700;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,212,121,.16);color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold)}

#tip{position:fixed;z-index:60;pointer-events:none;display:flex;gap:6px;align-items:flex-start}

function animMob(e, dt, moving, speed) {

    if (p.arms) { const up = -2.6 * wind; p.arms[0].rotation.x = e.windup > 0 ? up : moving ? -s * 0.4 : 0; p.arms[1].rotation.x = e.windup > 0 ? up : moving ? s * 0.4 : 0; }

function buildPet(kind) {
  if (kind === 'imp') return buildMobModel({ model: 'imp', color: 0xd8483a }, 1);
  if (kind === 'wolf') { const r = buildMobModel({ model: 'quad', color: 0x7ac8ff, color2: 0xd8f0ff, eye: 0xffffff, glowEyes: true }, 0.9); r.g.traverse((o) => { if (o.isMesh && o.material && o.material.isMeshToonMaterial) o.material.emissive = new THREE.Color(0x1a4a7a); }); return r; }
  return buildMobModel({ model: 'golem', color: 0x3a2a2a }, 0.6);
}

function genItem(ilvl, rarity, slot, cls, zone = 'vale') {
  ilvl = clamp(Math.round(ilvl), 1, 30);
  const C = CLASSES[cls], S = SLOT[slot], R = RARITY[rarity], tier = clamp(Math.floor((ilvl - 1) / 5), 0, 4);
  const isW = slot === 'main' || slot === 'off', wtype = isW ? WEAPON[cls][slot === 'main' ? 0 : 1] : null;
  const armorType = slot === 'back' ? 'cloth' : C.armor;
  const prim = cls === 'druid' ? pick(['agi', 'int']) : C.primary;
  const budget = (3 + ilvl * 1.5) * R.mult * S.w * (rarity >= 4 ? 1.1 : 1);
  const stats = {};
  stats[prim] = Math.max(1, Math.round(budget * 0.5));
  stats.sta = Math.max(1, Math.round(budget * 0.4));
  let sec = null;
  if (rarity >= 2) { sec = pick(['crit', 'haste']); stats[sec] = Math.max(1, Math.round(budget * 0.3)); }
  if (rarity >= 3) { const o = sec === 'crit' ? 'haste' : 'crit'; stats[o] = Math.max(1, Math.round(budget * 0.2)); }
  if (S.ar > 0) stats.armor = Math.round((ilvl * 1.6 + 6) * S.ar * 10 * { cloth: 1, leather: 1.7, mail: 2.6 }[armorType] * (0.85 + 0.15 * R.mult));
  let dmg = 0;
  if (slot === 'main') dmg = Math.round((4 + ilvl * 2) * R.mult * (cls === 'rogue' ? 0.75 : 1));
  if (slot === 'off' && cls === 'rogue') dmg = Math.round((4 + ilvl * 2) * R.mult * 0.45);
  // name
  const nounList = isW ? NOUN[wtype] : Array.isArray(NOUN[slot]) ? NOUN[slot] : NOUN[slot][armorType];
  const noun = pick(nounList);
  let name;
  if (rarity >= 5) name = pick(LEGEND);
  else if (rarity === 4) name = `${pick(ZONE_PRE[zone] || ZONE_PRE.vale)} ${noun} ${pick(EPIC_SUF)}`;
  else if (rarity === 3) name = `${pick(ZONE_PRE[zone] || ZONE_PRE.vale)} ${noun}`;
  else {
    const mat = (S.ar > 0 && slot !== 'back' ? MATERIAL[armorType] : MATERIAL.other)[tier];
    const suf = rarity >= 2 ? (sec === 'crit' ? ' of Precision' : sec === 'haste' ? ' of Swiftness' : '') || (prim === 'agi' ? ' of the Tiger' : ' of the Owl') : '';
    name = `${mat} ${noun}${rarity === 2 && Math.random() < 0.4 ? (prim === 'agi' ? ' of the Tiger' : ' of the Owl') : suf}`;
  }
  return { id: uid(), name, slot, rarity, ilvl, req: clamp(ilvl - 1, 1, MAX_LVL), cls, type: isW ? wtype : (S.ar > 0 ? armorType[0].toUpperCase() + armorType.slice(1) : ''), stats, dmg,
    sell: Math.round((3 + ilvl * ilvl * 0.5) * (0.5 + R.mult * R.mult * 0.5)), color: pick(ICOL[rarity]) };
}

}

/* ---------------- quests ---------------- */
// obj: kill {t:'kill', m, n} | loot {t:'loot', m:[types], item, n, p} | gather {t:'gather', k, n}
const QUESTS = [];
function Q(id, giver, lvl, title, text, obj, o = {}) { QUESTS.push(Object.assign({ id, giver, lvl, title, text, obj, req: [], reward: 'green' }, o)); }
const K = (m, n) => ({ t: 'kill', m, n }), L = (m, item, n, p) => ({ t: 'loot', m: [].concat(m), item, n, p }), GA = (k, n) => ({ t: 'gather', k, n });

Q('q_gorrak', 'brannoc', 6, 'The Bandit King', 'Their leader calls himself Gorrak the Bandit King. He\'s strong and he hits hard. Watch for the glowing circle on the ground when he swings, and get out of it. End his reign.', [K('gorrak', 1)], { req: ['q_crates'], reward: 'blue', xpMul: 2, done: 'The Bandit King is gone! Emberfall owes you a great debt.' });
Q('q_tusk', 'hobb', 5, 'Wanted: Old Tusk', 'There\'s a boar out in the west field bigger than my barn. Old Tusk, we call him. He\'s gored three of my best fence posts. Put him down.', [K('oldtusk', 1)], { req: ['q_bacon'], reward: 'blue', xpMul: 1.5, done: 'You actually did it! Here, you\'ve earned this.' });
Q('q_letter', 'maren', 5, 'A Letter for Thornhold', 'Warden Sylva in Thornhold, deep in Whisperwood to the west, has asked for help. Follow the road west and give her this letter.', [], { req: ['q_bloom'], turnin: 'sylva', reward: 'none', done: 'A letter from Maren? Then things are worse than I feared.' });

Q('q_cult', 'sylva', 8, 'The Thorn Cult', 'A cult has gathered at the Thorn Circle, northwest of town. They\'re the ones poisoning the forest. Stop eight of them.', [K('cultist', 8)], { req: ['q_webs'], done: 'The circle is quiet. For now.' });

Q('q_gloom', 'kael', 9, 'Wanted: Gloomfang', 'A huge spider called Gloomfang hunts in the Old Grove. It has already killed two of my rangers. Avenge them.', [K('gloomfang', 1)], { req: ['q_wisps'], reward: 'blue', xpMul: 1.5, done: 'Rest easy, friends. It\'s done.' });
Q('q_silkweaver', 'sylva', 10, 'Mother Silkweaver', 'The spider queen nests in Silk Hollow. She spits webs that slow and burn. Watch the ground and keep moving. Kill her and the forest will heal.', [K('silkweaver', 1)], { req: ['q_cult', 'q_tomes'], reward: 'blue', xpMul: 2, done: 'Whisperwood is free. You have the forest\'s thanks, and mine.' });
Q('q_tomarsh', 'sylva', 10, 'South to the Marsh', 'Reeve Halden of Reedwater, in Mirefen Marsh to the south, sent word of trouble. Take the road back through the vale and south.', [], { req: ['q_cult'], turnin: 'halden', reward: 'none', done: 'Sylva sent you? Good. We need a fighter.' });

function removePet(p) { scene.remove(p.g); pets.splice(pets.indexOf(p), 1); }

/* ---------------- monster AI ---------------- */
function updateEnemy(e, dt) {

    if (e.deathT < 1) { e.deathT += dt * 1.8; const s = Math.max(0.01, 1 - e.deathT); e.g.scale.setScalar(s * e.sc); if (e.deathT >= 1) e.g.visible = false; }

  e.g.visible = !far; if (far) return;

/* ---------------- quests ---------------- */
function qState(q) {
  const Qs = CH.quests;
  if (Qs.done[q.id]) return 'done';
  const a = Qs.active[q.id];
  if (a) return q.obj.every((o, i) => a.p[i] >= o.n) ? 'ready' : 'active';
  if (!q.req.every((r) => Qs.done[r])) return 'locked';
  return P.lvl >= q.lvl - 2 ? 'avail' : 'soon';
}
function acceptQuest(id) {
  const q = QUEST[id]; if (Object.keys(CH.quests.active).length >= 20) return fail('Your quest log is full.');
  CH.quests.active[id] = { p: q.obj.map(() => 0) }; toast(`Quest accepted: ${q.title}`); refreshPanels(); saveChar();
}
function abandonQuest(id) { delete CH.quests.active[id]; toast(`Quest abandoned: ${QUEST[id].title}`); refreshPanels(); saveChar(); }
function questProgress(match, label) {
  for (const id in CH.quests.active) {
    const q = QUEST[id], a = CH.quests.active[id]; let changed = false;
    q.obj.forEach((o, i) => { if (a.p[i] >= o.n) return; const r = match(o); if (r) { a.p[i]++; changed = true; toast(`${r === true ? label(o) : r}: ${a.p[i]}/${o.n}`); } });
    if (changed && qState(q) === 'ready') { const tn = NPC[q.turnin || q.giver]; toast(`Quest complete: ${q.title}. Return to ${tn.name}.`); spawnRing(P.x, P.z, 0xffd479, 3); }
  }
  refreshPanels();
}
function onKillQuest(e) {
  questProgress((o) => {
    if (o.t === 'kill' && (o.m === e.type || o.m === e.named || (!e.named && o.m === e.base))) return true;
    if (o.t === 'loot' && o.m.includes(e.named ? '' : e.base) && Math.random() < o.p) return o.item;
    return false;
  }, (o) => (o.t === 'kill' ? (MOBS[o.m] ? MOBS[o.m].name : NAMED[o.m].name) + ' slain' : o.item));
}
function questRewards(q) {
  if (!q._choices) {
    const src = { green: 'quest', blue: 'quest-blue', epic: 'quest-epic' }[q.reward];
    if (src) { const slots = GEAR_SLOTS.slice().sort(() => Math.random() - 0.5).slice(0, 2); const zone = TOWN[NPC[q.giver].town].zone; q._choices = slots.map((s) => genItem(q.lvl + 1, rollRarity(src), s, CH.cls, zone)); }
    else q._choices = [];
  }
  return q._choices;
}
function turnIn(id, choice) {
  const q = QUEST[id]; if (qState(q) !== 'ready') return;
  const items = questRewards(q);
  if (items.length && !items[choice]) return fail('Choose a reward first.');
  if (items.length && CH.inv.indexOf(null) < 0) return fail('Your bags are full.');
  delete CH.quests.active[id]; CH.quests.done[id] = true;
  const xp = questXP(q), gold = questGold(q);
  gainXP(xp); P.gold += gold; if (q.reward === 'potions') P.potions += 3;
  if (items.length) addItem(items[choice]);
  q._choices = null;
  toast(`Quest complete: ${q.title}. +${xp} xp, +${gold} g`); spawnRing(P.x, P.z, 0xffd479, 4, 0.8);
  refreshPanels(); saveChar();
}

/* ---------------- world interaction ---------------- */
function spawnNpcs() {
  for (const n of NPCS) {
    const t = TOWN[n.town], x = t.x + n.dx, z = t.z + n.dz, model = buildHero(n.look);
    model.g.position.set(x, groundAt(x, z), z); model.g.rotation.y = Math.atan2(t.x - x, t.z - z); scene.add(model.g);
    addCollider(x, z, 0.6); npcs.push({ def: n, model, x, z, y: groundAt(x, z), baseRot: model.g.rotation.y, phase: rand(0, 6) });
  }
}
function npcMarker(n) {
  let best = null;
  for (const q of QUESTS) {
    const st = qState(q);
    if (st === 'ready' && (q.turnin || q.giver) === n.id) return 'ready';
    if (st === 'avail' && q.giver === n.id) best = 'avail';
    else if (st === 'active' && (q.turnin || q.giver) === n.id && !best) best = 'active';
  }
  return best;
}

  for (const nd of nodes) if (nd.on && Math.hypot(P.x - nd.x, P.z - nd.z) < 2.6) return { kind: 'node', nd };
  return null;
}
function gatherNode(nd) {

  if (!needed && nd.kind !== 'emberbloom') return fail(`You have no use for ${GATHER[nd.kind].name} right now.`);
  nd.on = false; nd.g.visible = false; nd.t = 45; spawnRing(nd.x, nd.z, 0xffd479, 1.5);
  if (needed) questProgress((o) => (o.t === 'gather' && o.k === nd.kind ? true : false), () => GATHER[nd.kind].name);

}
function discoverTowns() {
  for (const t of TOWNS) if (!CH.towns[t.id] && Math.hypot(P.x - t.x, P.z - t.z) < 45) {
    CH.towns[t.id] = true; const xp = 30 * ZONE[t.zone].lv[0]; gainXP(xp); toast(`Discovered: ${t.name}. +${xp} xp`); saveChar();
  }
}
function flyTo(id) {
  const t = TOWN[id], cost = flightCost(id); if (P.gold < cost) return fail('You can\'t afford that flight.');
  P.gold -= cost; closeAllWindows(); const f = $('fade'); f.textContent = `Flying to ${t.name}…`; f.classList.add('on');
  setTimeout(() => { P.x = t.x - 8; P.z = t.z + 10; P.y = groundAt(P.x, P.z); P.vy = 0; dismissPets(); target = null; camLook.set(P.x, P.y + 1.7, P.z); saveChar(); }, 650);
  setTimeout(() => f.classList.remove('on'), 1300);
}
function flightCost(id) { const t = TOWN[id]; return Math.max(1, Math.round(Math.hypot(t.x - P.x, t.z - P.z) / 40)); }
function vendorStock(n) {
  if (!n._stock || n._stockLvl !== P.lvl) { const zone = TOWN[n.town].zone, lv = clamp(P.lvl, ZONE[zone].lv[0], ZONE[zone].lv[1]); n._stock = []; n._stockLvl = P.lvl;
    for (let i = 0; i < 6; i++) { const it = genItem(lv, rollRarity('vendor'), pick(GEAR_SLOTS), CH.cls, zone); it.price = it.sell * 4; n._stock.push(it); } }
  return n._stock;

const potionPrice = () => 5 + P.lvl * 2;

const _icons = new Map();

  x.lineWidth = 5; x.strokeStyle = 'rgba(10,12,26,.85)'; x.strokeText(ini, 32, 34); x.fillStyle = '#fff'; x.fillText(ini, 32, 34);

}

  else if (s === 'back') path([[20, 12], [44, 12], [54, 54], [32, 48], [10, 54]]);
  else if (s === 'chest') path([[18, 12], [26, 16], [38, 16], [46, 12], [56, 24], [48, 30], [48, 54], [16, 54], [16, 30], [8, 24]]);
  else if (s === 'hands') { path([[20, 54], [20, 22], [26, 14], [32, 14], [34, 22], [40, 18], [46, 24], [44, 36], [46, 54]]); }

/* ---------------- tooltips ---------------- */
const tipEl = $('tip');
function statLines(it) {
  let h = '';

  if (it.stats.armor) h += `<div>${it.stats.armor} Armor</div>`;
  for (const k of ['sta', 'agi', 'int']) if (it.stats[k]) h += `<div>+${it.stats[k]} ${STAT_NAME[k]}</div>`;
  for (const k of ['crit', 'haste']) if (it.stats[k]) h += `<div class="g">Equip: +${it.stats[k]} ${STAT_NAME[k]} rating</div>`;
  return h;
}
function itemTipHtml(it, label) {
  if (it.slot === 'junk') return `<div class="tt"><span class="nm q0">${esc(it.name)}</span><div class="m">Junk</div><div class="m">Sell price: ${it.sell} g</div></div>`;
  const req = it.req > P.lvl ? 'r' : '';
  return `<div class="tt">${label ? `<div class="cur">${label}</div>` : ''}<span class="nm q${it.rarity}">${esc(it.name)}</span>
    <div class="y">Item Level ${it.ilvl}</div><div class="row"><span>${SLOT[it.slot].name}</span><span>${it.type || ''}</span></div>${statLines(it)}
    <div class="${req}">Requires Level ${it.req}</div><div class="m">${RARITY[it.rarity].name} · Sell price: ${it.sell} g</div></div>`;
}
function compareHtml(it) {
  if (!it || it.slot === 'junk') return '';
  const cur = CH.equip[it.slot]; const keys = ['dmg', 'armor', 'sta', 'agi', 'int', 'crit', 'haste'];
  const val = (x, k) => (x ? (k === 'dmg' ? x.dmg || 0 : x.stats[k] || 0) : 0);
  const diff = keys.map((k) => [k, val(it, k) - val(cur, k)]).filter(([, d]) => d);
  if (!diff.length) return '';
  return `<div class="tt" style="width:190px"><div class="cur">If you equip this</div>${diff.map(([k, d]) => `<div class="${d > 0 ? 'g' : 'r'}">${d > 0 ? '+' : ''}${d} ${k === 'dmg' ? 'Weapon Damage' : STAT_NAME[k]}</div>`).join('')}</div>`;
}
function showTip(html, ev) {
  tipEl.innerHTML = html; tipEl.hidden = false;
  const r = tipEl.getBoundingClientRect(); let x = ev.clientX + 16, y = ev.clientY + 12;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 16; if (y + r.height > innerHeight - 8) y = innerHeight - r.height - 8;
  tipEl.style.left = Math.max(8, x) + 'px'; tipEl.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tipEl.hidden = true; }
function skillTipHtml(sk) {
  const locked = P.lvl < sk.lvl;
  return `<div class="tt"><span class="nm">${esc(sk.name)}</span><div class="row m"><span>${sk.range ? sk.range + ' yd range' : 'Instant'}</span><span>${skillCd(sk) >= 1.5 ? Math.round(skillCd(sk) * 10) / 10 + ' sec cooldown' : ''}</span></div>

// Hover tooltips for anything with data-tip.
document.addEventListener('pointerover', (ev) => {

  const html = tipFor(el.dataset.tip); if (html) showTip(html, ev);

function itemFromRef(ref) {
  const [k, v] = ref.split(':');

/* ---------------- item action popup ---------------- */
const iact = $('iact');
function openItemActions(ref, ev) {

    if (curVendor) btns.push([`Sell (${it.sell} g)`, () => sellItem(+v)]);
    btns.push(['Destroy', () => destroyItem(+v), 'danger']);
  } else if (k === 'e') btns.push(['Unequip', () => unequip(v)]);
  else if (k === 'v') btns.push([`Buy (${it.price} g)`, () => buyItem(+v)]);

  for (const [label, fn, cls] of btns.concat([['Cancel', () => {}, 'ghost']])) { const b = document.createElement('button'); b.className = 'btn sm ' + (cls || ''); b.textContent = label; b.onclick = () => { iact.hidden = true; fn(); }; row.appendChild(b); }

/* ---------------- windows ---------------- */
const WINS = ['winChar', 'winBags', 'winTal', 'winQuest', 'winSpell', 'winMap', 'winVendor', 'winNpc', 'winMenu', 'winSet'];
function openWin(id) {
  if (mode !== 'play') return;
  if (id === 'winTal' && P.lvl < 10) { toast('Talents unlock at level 10.'); }
  $(id).hidden = false; renderWin(id);
}
function closeWin(id) { $(id).hidden = true; hideTip(); if (id === 'winVendor') { curVendor = null; $('btnJunk').hidden = true; } if (id === 'winNpc') curQuestView = null; canvas.focus(); }

const anyModal = () => !$('winMenu').hidden || !$('winSet').hidden;
const anyOpen = () => WINS.some((id) => !$(id).hidden);
document.querySelectorAll('.win [data-close]').forEach((b) => b.addEventListener('click', () => closeWin(b.closest('.win').id)));
document.querySelectorAll('#micro [data-open]').forEach((b) => b.addEventListener('click', () => toggleWin(b.dataset.open)));
function renderWin(id) {
  if (id === 'winChar') renderChar(); else if (id === 'winBags') renderBags(); else if (id === 'winTal') renderTalents(); else if (id === 'winQuest') renderQuestLog();
  else if (id === 'winSpell') renderSpells(); else if (id === 'winMap') renderBigMap(); else if (id === 'winVendor') renderVendor(); else if (id === 'winSet') renderSettings();
}
function refreshPanels() {
  if (mode !== 'play') return;
  for (const id of ['winChar', 'winBags', 'winTal', 'winQuest', 'winVendor']) if (!$(id).hidden) renderWin(id);
  if (!$('winNpc').hidden && curNpc) { if (curQuestView) showQuest(curQuestView); }
  renderTracker(); $('mTal').classList.toggle('dot', P.lvl >= 10 && talentSpent() < talentPoints());
}

/* ---------------- character panel ---------------- */
const prev = { renderer: null, scene: null, cam: null, model: null, yaw: 0.3, dirty: true };
function initPreview() {
  const c = $('charCanvas');
  prev.renderer = new THREE.WebGLRenderer({ canvas: c, antialias: true, alpha: true });
  prev.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  prev.scene = new THREE.Scene();
  prev.scene.add(new THREE.HemisphereLight(0xffffff, 0x6a7090, 0.9));
  const d = new THREE.DirectionalLight(0xffffff, 0.7); d.position.set(2, 4, 5); prev.scene.add(d);
  prev.cam = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
  let drag = null;
  c.addEventListener('pointerdown', (e) => { drag = e.clientX; c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', (e) => { if (drag != null) { prev.yaw += (e.clientX - drag) * 0.012; drag = e.clientX; } });
  c.addEventListener('pointerup', () => (drag = null));
}
function renderPreview(dt) {
  if ($('winChar').hidden || !prev.renderer) return;
  const c = $('charCanvas'), w = c.clientWidth, h = c.clientHeight; if (!w || !h) return;
  if (c.width !== Math.round(w * prev.renderer.getPixelRatio())) { prev.renderer.setSize(w, h, false); prev.cam.aspect = w / h; prev.cam.updateProjectionMatrix(); }
  if (prev.dirty) { if (prev.model) prev.scene.remove(prev.model.g); prev.model = buildHero(CH, CH.equip); prev.scene.add(prev.model.g); prev.dirty = false; }
  prev.model.g.rotation.y = prev.yaw; animBiped(prev.model, 0, false, -1);
  const ht = 2.5 * RACE_SHAPE[CH.race].h; prev.cam.position.set(0, ht * 0.55, 7.2); prev.cam.lookAt(0, ht * 0.5, 0);
  prev.renderer.render(prev.scene, prev.cam);
}
function renderChar() {
  prev.dirty = true;
  $('dollL').innerHTML = DOLL_L.map((s) => itemSlotHtml(CH.equip[s], 'e:' + s)).join('');
  $('dollR').innerHTML = DOLL_R.map((s) => itemSlotHtml(CH.equip[s], 'e:' + s)).join('');
  $('dollW').innerHTML = DOLL_W.map((s) => itemSlotHtml(CH.equip[s], 'e:' + s)).join('');
  $('dollName').innerHTML = `${esc(CH.name)}<small>Level ${P.lvl} ${RACES[CH.race].name} ${CLASSES[CH.cls].name}</small>`;
  const st = P.stats, prim = primaryOf(CH.cls, P.form);
  const rows = [['Health', P.maxHp], ['Attack power', Math.round(atk())], ['Stamina', st.sta], [prim === 'agi' ? 'Agility' : 'Intellect', st[prim]],
    ['Critical strike', P.critPct.toFixed(1) + '%'], ['Haste', P.haste.toFixed(1) + '%'], ['Armor', `${P.armor} (${Math.round(armorDR(P.lvl) * 100)}%)`], ['Move speed', Math.round(P.speedMul * 100) + '%'],
    ['Item level', Math.round(GEAR_SLOTS.reduce((a, s) => a + (CH.equip[s] ? CH.equip[s].ilvl : 0), 0) / GEAR_SLOTS.length * 10) / 10], ['Talent points', `${talentSpent()} / ${talentPoints()}`]];
  $('charStats').innerHTML = rows.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('');
  wireItemSlots($('winChar'));
}

/* ---------------- bags & vendor ---------------- */
let curVendor = null;
function renderBags() {
  $('bagGrid').innerHTML = CH.inv.map((it, i) => itemSlotHtml(it, 'b:' + i)).join('');
  $('bagGold').textContent = P.gold + ' g'; $('bagPot').textContent = P.potions;
  $('btnJunk').hidden = !curVendor; wireItemSlots($('winBags'));
}
$('btnSort').onclick = () => sortBags();
$('btnJunk').onclick = () => { let g = 0, n = 0; CH.inv.forEach((it, i) => { if (it && it.slot === 'junk') { g += it.sell; n++; CH.inv[i] = null; } }); if (!n) return toast('You have no junk to sell.'); P.gold += g; toast(`Sold ${n} junk items for ${g} g.`); refreshPanels(); saveChar(); };
function openVendor(n) { curVendor = n; $('vTitle').textContent = n.def.name; $('winNpc').hidden = true; openWin('winVendor'); openWin('winBags'); }
function renderVendor() {
  if (!curVendor) return;
  const stock = vendorStock(curVendor.def), pp = potionPrice();
  let h = `<div class="vrow"><span class="isl r1" style="width:44px;height:44px;display:grid;place-items:center;font-weight:800;color:var(--hp)">HP</span><span class="nm">Healing Potion<br><small class="m" style="color:var(--muted)">Restores 45% health. You have ${P.potions}.</small></span><span class="pr">${pp} g</span><button class="btn sm" id="buyPot">Buy</button></div>`;
  stock.forEach((it, i) => { h += `<div class="vrow">${itemSlotHtml(it, 'v:' + i)}<span class="nm q${it.rarity}">${esc(it.name)}<br><small style="color:var(--muted)">${SLOT[it.slot].name} · Level ${it.req}</small></span><span class="pr">${it.price} g</span><button class="btn sm" data-buy="${i}">Buy</button></div>`; });
  h += `<p style="color:var(--muted);font-size:12.5px;margin:10px 0 0">Right-click items in your bags to sell them, or use Sell junk.</p>`;
  $('vList').innerHTML = h;
  $('buyPot').onclick = () => { if (P.gold < pp) return fail('You can\'t afford that.'); P.gold -= pp; P.potions++; refreshPanels(); renderBags(); };
  $('vList').querySelectorAll('[data-buy]').forEach((b) => (b.onclick = () => buyItem(+b.dataset.buy)));
  wireItemSlots($('winVendor'));
}
function buyItem(i) {
  const stock = vendorStock(curVendor.def), it = stock[i]; if (!it) return;
  if (P.gold < it.price) return fail('You can\'t afford that.'); if (CH.inv.indexOf(null) < 0) return fail('Your bags are full.');
  P.gold -= it.price; stock.splice(i, 1); addItem(it); toast(`Bought ${it.name}.`); refreshPanels(); saveChar();
}

/* ---------------- talents ---------------- */
function talentTipHtml(ti, i) {
  const tal = TALENTS[CH.cls][ti].list[i], r = CH.talents[ti + '-' + i] || 0;
  return `<div class="tt"><span class="nm">${esc(tal.n)}</span><div class="m">Rank ${r}/${tal.max}${tal.cap ? ' · Capstone' : ''}</div>
    ${r ? `<div class="desc">${esc(tal.d(r))}</div>` : ''}${r < tal.max ? `<div class="${r ? 'm' : 'desc'}">${r ? 'Next rank: ' : ''}${esc(tal.d(r + 1))}</div>` : ''}
    ${treeSpent(ti) < TAL_ROW_REQ[i] ? `<div class="r">Requires ${TAL_ROW_REQ[i]} points in ${TALENTS[CH.cls][ti].name}</div>` : ''}</div>`;
}
function renderTalents() {
  const trees = TALENTS[CH.cls], free = talentPoints() - talentSpent();

      return `<button class="tal ${locked ? 'locked' : ''} ${r === tal.max ? 'max' : ''} ${tal.cap ? 'cap' : ''}" data-tal="${ti}-${i}" data-tip="t:${ti}-${i}"><span class="ti" style="background:${hex(t.color)}">${tal.n.split(' ').map((w) => w[0]).join('').slice(0, 2)}</span><span class="tn">${esc(tal.n)}</span><span class="tr">${r}/${tal.max}</span></button>`; }).join('')}</div></div>`).join('');
  $('talPts').innerHTML = P.lvl < 10 ? 'Talents unlock at level 10. You earn one point every level after that.' : `<b class="goldv">${free}</b> point${free === 1 ? '' : 's'} to spend`;
  $('trees').querySelectorAll('[data-tal]').forEach((b) => b.addEventListener('click', () => {
